name: Daily Kajkhoj Alert
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "digest or today"
        required: false
        default: "digest"
concurrency:
  group: kajkhoj-${{ github.event.inputs.mode || 'digest' }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event.inputs.mode || 'digest' }}
